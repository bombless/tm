    function resolve() {
        const enum_status = ['0:1', '0:2', '1:2']
        let replace_task = null;
        let status_offset = 0;
        let last_number = null;
        let position = 0;
        function next(cursor) {
            if (replace_task === null) {
                const [x, y] = enum_status[status_offset].split(':');
                if (x === position) {
                    last_number = cursor.read();
                    cusor.right();
                    postion += 1;
                }
                else if (y === position) {
                    const number = cursor.read();
                    if (number < last_number) {
                        replace_task = x;
                        cursor.put(last_number);
                        last_number = number;
                        postion -= 1;
                    }
                }
                else {
                    cursor.right();
                    postion += 1;
                }
            } else {
                if (replace_task < position) {
                    cursor.left();
                    postion -= 1;
                } else {
                    cursor.put(last_number);
                }
            }
        }

        const tape = [2, 5, 1];
        let tape_offset = 0;
        while(status_offset < 3) {
            next({
                put(n) {
                    tape[tape_offset] = n;
                },
                read() {
                    return tape[tape_offset];
                },
                left() {
                    tape_offset -= 1;
                },
                right() {
                    tape_offset += 1;
                }
            })
