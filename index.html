<!DOCTYPE html>
<main>
<tape>
    <p>tape</p>
    <actions>
        <button v-for="(v, k) in tapeFunctions" @click="v()">
            <span v-text="k"></span>
        </button>
    </actions>
    <div v-for="(v, k) in tapeVariables">
        <div v-text="k"></div>
        <div v-text="v"></div>
    </div>
</tape>
<tape-head>
    <p>状态转移表</p>
    <actions>
        <button v-for="(v, k) in tapeHeadFunctions" @click="runTapeHeadAction(v)">
            <span v-text="k"></span>
        </button>
    </actions>
    <p class="error-message" role="alert" v-if="tapeHeadVariables.error_message" v-text="tapeHeadVariables.error_message"></p>
    <div class="transition-table-wrap">
        <table class="transition-table">
            <thead>
                <tr>
                    <th>状态</th>
                    <th>条件 / 读入</th>
                    <th>写入</th>
                    <th>移动</th>
                    <th>下一状态</th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="row in transitionRows" :class="{ 'is-active': row.active }">
                    <td v-text="row.state"></td>
                    <td v-text="row.condition"></td>
                    <td v-text="row.write"></td>
                    <td v-text="row.move"></td>
                    <td v-text="row.next"></td>
                </tr>
            </tbody>
        </table>
    </div>
</tape-head>
</main>
<script src="https://cdn.jsdelivr.net/npm/vue"></script>
<script src="script.js"></script>
<link rel="stylesheet" href="style.css">
