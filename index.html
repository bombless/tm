<!DOCTYPE html>
<main>
<tape>
    <p>tape</p>
    <actions>
        <button v-for="(v, k) in tapeFunctions" @click="v()">
            <span v-text="k"></span>
        </button>
    </actions>
    <div v-for="(v, k) in tapeVariables">
        <div v-text="k"></div>
        <div v-text="v"></div>
    </div>
</tape>
<tape-head>
    <p>tape head</p>
    <actions>
        <button v-for="(v, k) in tapeHeadFunctions" @click="v()">
            <span v-text="k"></span>
        </button>
    </actions>
    <p class="error-message" role="alert" v-if="tapeHeadVariables.error_message" v-text="tapeHeadVariables.error_message"></p>
    <div v-for="(v, k) in tapeHeadVariables">
        <div v-text="k"></div>
        <div v-text="JSON.stringify(v)"></div>
    </div>
</tape-head>
</main>
<script src="https://cdn.jsdelivr.net/npm/vue"></script>
<script src="script.js"></script>
<link rel="stylesheet" href="style.css">
